html,body{margin:0;height:100%;background:#fff;overscroll-behavior:none}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
img{-webkit-user-drag:none}

/* ================= LOADER ================= */
#loader{position:fixed;inset:0;z-index:9999;background:var(--ld-bg,#fff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .9s ease,visibility .9s}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.ld-box{width:var(--ld-size,132px);height:var(--ld-size,132px);border-radius:24px;overflow:hidden;display:grid;place-items:center;background:#f3f4f6;box-shadow:0 12px 34px rgba(0,0,0,.14)}
.ld-box img,.ld-box video,.ld-box svg{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ld-bar{width:min(250px,70vw);height:5px;border-radius:9px;background:var(--ld-track,#e5e7eb);overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:var(--ld-bar,#111);border-radius:9px}
.ld-txt{font-weight:800;letter-spacing:.36em;font-size:13px;color:var(--ld-txt,#111);padding-left:.36em;display:flex;align-items:flex-end}
.ld-dots{display:inline-flex;gap:.5em;margin-left:.55em}
.ld-dots i{font-style:normal;display:inline-block;animation:ldDot 1.2s infinite ease-in-out both}
.ld-dots i:nth-child(2){animation-delay:.2s}
.ld-dots i:nth-child(3){animation-delay:.4s}
@keyframes ldDot{0%,75%,100%{opacity:.15;transform:translateY(0)}35%{opacity:1;transform:translateY(-5px)}}

/* ================= STAGE ================= */
.stage{position:fixed;inset:0;overflow:hidden;color:var(--tx,#fff);font-family:var(--font,'Poppins',system-ui,sans-serif);font-size:var(--fs,15px);line-height:1.5}
.stage.pv{position:relative;inset:auto;width:100%;height:100%}
.bg{position:absolute;inset:0;z-index:0;background:var(--bg,#06101f)}
.bg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scroll{position:absolute;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.col{width:100%;max-width:var(--mw,480px);margin:0 auto;padding:0 16px 34px;min-height:100%;display:flex;flex-direction:column}
.stage a{color:inherit}

/* blok + animasi masuk */
.blk{margin-top:var(--mt,14px);margin-bottom:var(--mb,0)}
.stage:not(.noanim) .blk[data-anim]:not(.in){opacity:0}
.blk.in[data-anim]{animation:var(--an) var(--dur,.75s) cubic-bezier(.2,.8,.2,1) var(--dl,0s) both}
@keyframes a-swipeUp{from{opacity:0;transform:translateY(46px)}to{opacity:var(--op,1);transform:none}}
@keyframes a-fade{from{opacity:0}to{opacity:var(--op,1)}}
@keyframes a-zoom{from{opacity:0;transform:scale(.8)}to{opacity:var(--op,1);transform:none}}
@keyframes a-left{from{opacity:0;transform:translateX(-52px)}to{opacity:var(--op,1);transform:none}}
@keyframes a-right{from{opacity:0;transform:translateX(52px)}to{opacity:var(--op,1);transform:none}}
@keyframes a-flip{from{opacity:0;transform:perspective(700px) rotateX(-75deg)}to{opacity:var(--op,1);transform:none}}
@keyframes a-bounce{0%{opacity:0;transform:translateY(70px)}55%{opacity:var(--op,1);transform:translateY(-12px)}78%{transform:translateY(5px)}100%{opacity:var(--op,1);transform:none}}
.pv .blk{cursor:pointer}
.pv .blk.sel{outline:2px dashed #38bdf8;outline-offset:3px;border-radius:10px}

/* ================= HERO ================= */
.hero{position:relative;margin-left:-16px;margin-right:-16px;--ls:120px}
.hero[data-pos=bottom]{margin-bottom:calc(var(--ls)/2 + 6px)}
.hero-bn{position:relative;overflow:hidden;border-radius:0 0 30px 30px;aspect-ratio:var(--ratio,16/9);background:#0b1b33;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.hero-bn img{position:absolute;left:-6%;top:-6%;width:112%;height:112%;object-fit:cover;filter:blur(var(--bl,0px))}
.hero-bn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,calc(var(--ov,.3)*.55)),rgba(0,0,0,var(--ov,.3)))}
.logo{position:absolute;left:50%;top:50%;width:var(--ls);height:var(--ls);transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;z-index:2}
.hero[data-pos=bottom] .logo{top:100%}
.logo img{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:4px solid var(--lb,#fff);background:#0b1b33;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.logo::before{content:"";position:absolute;inset:-8px;border-radius:50%;opacity:0}
.logo[data-ring=spin]::before{opacity:.95;background:conic-gradient(from 0deg,var(--ac),transparent 35%,var(--ac) 65%,transparent);animation:spin 5s linear infinite}
.logo[data-ring=pulse]::before{opacity:.7;background:var(--ac);filter:blur(12px);animation:pulse 2.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.94);opacity:.35}50%{transform:scale(1.1);opacity:.85}}

/* ================= TEKS ================= */
.ttl{display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;font-size:var(--sz,26px);font-weight:var(--wt,800);letter-spacing:var(--sp,1px);text-shadow:0 0 var(--gl,0px) var(--ac)}
.hero+.ttl,.hero[data-pos=bottom]~.ttl{margin-top:var(--mt,14px)}
.ttl .vb{display:inline-block;width:.52em;height:.52em;flex:none;color:var(--bc,#38bdf8)}
.ttl .vb svg{width:100%;height:100%;display:block}
.txt{text-align:var(--al,center);font-size:var(--sz,1em);font-weight:var(--wt,400);color:var(--c,inherit);white-space:pre-wrap;line-height:1.65}
.desc{position:relative;background:var(--card,rgba(128,128,128,.5));border:1px solid rgba(255,255,255,.14);border-radius:var(--r,18px);padding:14px 16px;font-size:var(--sz,.95em);color:var(--c,inherit);text-align:var(--al,center);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.desc .gh{display:block;visibility:hidden;white-space:pre-wrap;line-height:1.65}
.desc .ty{position:absolute;left:16px;right:16px;top:14px;white-space:pre-wrap;line-height:1.65}
.cur{display:inline-block;width:2px;height:1.1em;background:currentColor;vertical-align:-.2em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ================= TOMBOL ================= */
.btn{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r,18px);text-decoration:none;color:var(--bt,#fff);overflow:hidden;isolation:isolate;transition:transform .18s ease,box-shadow .25s ease;-webkit-user-select:none;user-select:none;cursor:pointer}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn[data-st=glass]{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.28);box-shadow:0 8px 24px rgba(0,0,0,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn[data-st=solid]{background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:0 10px 26px rgba(0,0,0,.32)}
.btn[data-st=outline]{border:2px solid var(--b1);background:rgba(0,0,0,.12)}
.btn[data-st=neon]{border:1.5px solid var(--b1);background:rgba(0,0,0,.3);box-shadow:0 0 16px var(--b1),inset 0 0 12px rgba(255,255,255,.05)}
.btn .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;font-size:22px;overflow:hidden}
.btn .ic svg{width:24px;height:24px}
.btn .ic img{width:100%;height:100%;object-fit:cover}
.btn .bt{flex:1;min-width:0;text-align:left}
.btn .bt b{display:block;font-weight:700;line-height:1.25}
.btn .bt small{display:block;opacity:.78;font-size:.78em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn .go{flex:none;opacity:.7;width:18px;height:18px}
.btn.shine::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:38%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine var(--se,3.4s) ease-in-out var(--sd,0s) infinite;pointer-events:none;z-index:3}
@keyframes shine{0%,52%{left:-60%}100%{left:135%}}
.btn .sp{position:absolute;right:44px;top:7px;width:15px;height:15px;opacity:0;z-index:4;pointer-events:none;color:#fff;filter:drop-shadow(0 0 5px #fff);animation:cling var(--se,3.4s) ease-out var(--sd,0s) infinite}
@keyframes cling{0%,62%{opacity:0;transform:scale(0) rotate(0)}72%{opacity:1;transform:scale(1.25) rotate(25deg)}86%{opacity:0;transform:scale(.4) rotate(70deg)}100%{opacity:0}}
.noshine::after,.noshine .sp{display:none}

/* ================= SLIDER ================= */
.slider{position:relative}
.sl-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sl-track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;min-width:0}
.sl-img{position:relative;aspect-ratio:var(--ratio,16/9);border-radius:var(--r,18px);overflow:hidden;background:#0b1b33;border:1px solid rgba(255,255,255,.16)}
.sl-img img,.sl-img video{width:100%;height:100%;object-fit:cover;display:block}
.sl-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:#fff;font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .15s,background .2s;padding:0 0 3px}
.sl-nav:active{transform:translateY(-50%) scale(.9)}
.sl-nav.n{right:10px}
.sl-nav.p{left:10px}
.sl-card{margin-top:10px;background:var(--card,rgba(128,128,128,.5));border:1px solid rgba(255,255,255,.14);border-radius:var(--r,18px);padding:14px;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.neon{margin:0 0 6px;font-weight:800;font-size:1.2em;letter-spacing:.5px;color:#fff;text-shadow:0 0 4px var(--ng),0 0 12px var(--ng),0 0 28px var(--ng);animation:neon 3.2s ease-in-out infinite}
@keyframes neon{0%,100%{opacity:1}48%{opacity:.78}52%{opacity:1}56%{opacity:.85}}
.sl-card p{margin:0 0 12px;font-size:.9em;opacity:.92;white-space:pre-wrap}
.sl-card .btn{justify-content:center;text-align:center}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:7px;height:7px;border-radius:9px;background:rgba(255,255,255,.35);transition:all .25s;cursor:pointer}
.dots i.on{width:22px;background:var(--ac)}

/* ================= BLOK LAIN ================= */
.img-b{display:block;overflow:hidden;border-radius:var(--r,18px);border:1px solid rgba(255,255,255,.14)}
.img-b img,.vid-b video{width:100%;display:block;object-fit:var(--fit,cover);aspect-ratio:var(--ratio,auto)}
.vid-b{overflow:hidden;border-radius:var(--r,18px);border:1px solid rgba(255,255,255,.14);background:#000}
.emb-b{overflow:hidden;border-radius:var(--r,18px);border:1px solid rgba(255,255,255,.14);background:#000}
.emb-b iframe{width:100%;height:var(--h,315px);border:0;display:block}
.links-b{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--g,12px)}
.links-b a{display:block;width:var(--sz,46px);height:var(--sz,46px);border-radius:50%;border:1px solid rgba(255,255,255,.25);overflow:hidden;transition:transform .18s}
.links-b a:hover{transform:translateY(-3px) scale(1.06)}
.links-b .ic{width:100%;height:100%;display:grid;place-items:center;color:#fff;font-size:calc(var(--sz,46px)*.46)}
.links-b .ic svg{width:50%;height:50%}
.links-b .ic img{width:100%;height:100%;object-fit:cover}
.div-b{margin-left:auto;margin-right:auto;width:var(--w,60%);height:var(--th,2px);background:var(--c,rgba(255,255,255,.35));border-radius:9px}
.div-b[data-s=gradient]{background:linear-gradient(90deg,transparent,var(--c,#38bdf8),transparent)}
.div-b[data-s=dots]{height:0;border-top:var(--th,2px) dotted var(--c,#fff);background:none;border-radius:0}
.div-b[data-s=dashed]{height:0;border-top:var(--th,2px) dashed var(--c,#fff);background:none;border-radius:0}
.sp-b{height:var(--h,24px)}
.foot{margin-top:auto;padding-top:28px;text-align:center;font-size:.72em;letter-spacing:.4px;opacity:.65;-webkit-user-select:none;user-select:none}

/* ================= ADMIN ================= */
#admin{position:fixed;inset:0;z-index:10000;background:rgba(2,6,16,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:10px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#e6edf7;font-size:14px;line-height:1.45}

/* ---------- JSONBin (multi-bin: baca acak + failover, simpan ke semua) ---------- */
const BINAPI='https://api.jsonbin.io/v3/b/';
async function readBin(b){
  const r=await tmo(fetch(`${BINAPI}${b.id}/latest?meta=false`,{cache:'no-store',headers:b.key?{'X-Access-Key':b.key}:{}}),9000);
  if(!r.ok)throw new Error('http '+r.status);
  let rec=await r.json();
  if(rec&&rec.record&&!rec.site)rec=rec.record;
  if(!rec||typeof rec!=='object')throw new Error('format');
  return rec;
}
const cacheRec=rec=>LS.set('ig_cfg',JSON.stringify({t:Date.now(),rec:Object.assign({},rec,{admin:undefined})}));
async function loadRec(fresh){
  const bins=getBins(),c=LS.json('ig_cfg');
  if(!bins.length)return null;
  if(!fresh){
    if(c&&Date.now()-c.t<300000)return c.rec;
    for(const b of shuffle(bins)){try{const rec=await readBin(b);cacheRec(rec);return rec}catch(e){}}
    return c?c.rec:null;
  }
  /* admin: baca SEMUA bin, pakai yang paling baru, laporkan status tiap bin */
  const res=await Promise.all(bins.map((b,i)=>readBin(b).then(rec=>({i,id:b.id,ok:1,rec}),e=>({i,id:b.id,ok:0,err:e.message}))));
  S.binInfo=res.map(r=>({id:r.id,ok:r.ok,err:r.err,updated:r.ok&&r.rec.meta&&r.rec.meta.updated||''}));
  const good=res.filter(r=>r.ok);
  if(!good.length)throw new Error(res.map(r=>`bin ${r.i+1}: ${r.err}`).join(', '));
  good.sort((a,b)=>String(b.rec.meta&&b.rec.meta.updated||'').localeCompare(String(a.rec.meta&&a.rec.meta.updated||'')));
  return good[0].rec;
}
const friendly=(st,m)=>st===401||st===403?(m||'Key ditolak (butuh izin Update)'):st===404?'Bin tidak ditemukan':st===429?'Terlalu banyak permintaan':`HTTP ${st} ${m||''}`;
async function putBin(b,body){
  const key=wkeyOf(b.id);
  if(!key)return{ok:0,err:'Access Key belum diisi'};
  const go=hd=>tmo(fetch(BINAPI+b.id,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hd),body}),15000);
  try{
    let r=await go({'X-Access-Key':key});
    if(r.status===401||r.status===403)r=await go({'X-Master-Key':key});
    if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}return{ok:0,err:friendly(r.status,m)}}
    return{ok:1};
  }catch(e){return{ok:0,err:e.message}}
}
async function saveRec(rec){

  const results=await Promise.all(bins.map(b=>putBin(b,body)));
  const okN=results.filter(r=>r.ok).length;
  if(!okN)throw new Error(results.map((r,i)=>(bins.length>1?`Bin ${i+1}: `:'')+r.err).join(' • '));
  cacheRec(rec);S.rec=rec;
  S.binInfo=bins.map((b,i)=>({id:b.id,ok:results[i].ok,err:results[i].err,updated:rec.meta&&rec.meta.updated||''}));
  return{n:body.length,ok:okN,total:bins.length,fail:results.map((r,i)=>r.ok?null:`Bin ${i+1}: ${r.err}`).filter(Boolean)};
}

const enc=new TextEncoder();
const toHex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const fromHex=s=>Uint8Array.from(s.match(/../g)||[],x=>parseInt(x,16));
async function pbkdf(pass,saltHex,it){
  const k=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);
  return toHex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:fromHex(saltHex),iterations:it},k,256));
}
async function makeAdmin(user,pass){
  const salt=toHex(crypto.getRandomValues(new Uint8Array(16))),it=150000;

/* ---------- animasi ngetik ---------- */
function typeInto(box,lines,o){
  const ty=$('.ty',box),cur=h('span',{class:'cur'});
  if(box._stop)box._stop();
  let alive=true,timer;
  box._stop=()=>{alive=false;clearTimeout(timer)};
  if(o.still||(W.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){ty.textContent=lines[0]||'';ty.append(cur);return}
  let li=0;const sp=clamp(o.speed||40,8,200);
  const run=()=>{
    if(!alive)return;
    const full=lines[li%lines.length]||'';let i=0;
    const tick=()=>{
      if(!alive)return;
      ty.textContent=full.slice(0,i);ty.append(cur);
      if(i<full.length){i++;timer=setTimeout(tick,sp*(.55+Math.random()*.9))}
      else if(o.loop){timer=setTimeout(erase,1900)}
    };
    const erase=()=>{
      if(!alive)return;let j=full.length;
      const d=()=>{if(!alive)return;j-=2;ty.textContent=full.slice(0,Math.max(j,0));ty.append(cur);if(j>0)timer=setTimeout(d,16);else{li++;timer=setTimeout(run,350)}};
      d();
    };
    tick();
  };
  run();
}

/* ---------- efek latar (canvas) ---------- */
function mountFx(bg,t,stage){
  const mode=t.fx,n=clamp(t.fxCount,0,120);
  if(!mode||mode==='none'||!n||(W.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))return;
  const cv=h('canvas'),ctx=cv.getContext('2d');bg.append(cv);
  const [cr,cg,cb]=rgb(cssColor(t.fxColor,'#7dd3fc'));
  let w=0,hh=0,ps=[],raf=0,on=true;
  const mk=()=>({x:Math.random()*w,y:Math.random()*hh,r:mode==='bubbles'?4+Math.random()*10:.8+Math.random()*2.6,vy:mode==='snow'?.3+Math.random()*.8:-(.15+Math.random()*.55),vx:(Math.random()-.5)*.3,a:.15+Math.random()*.5,p:Math.random()*6.28});
  const size=()=>{const r=bg.getBoundingClientRect(),d=Math.min(2,W.devicePixelRatio||1);w=r.width;hh=r.height;cv.width=w*d;cv.height=hh*d;ctx.setTransform(d,0,0,d,0,0);ps=Array.from({length:n},mk)};
  size();
  const ro=W.ResizeObserver?new ResizeObserver(size):null;if(ro)ro.observe(bg);
  const loop=()=>{
    if(!on||!cv.isConnected){if(ro)ro.disconnect();return}
    ctx.clearRect(0,0,w,hh);
    for(const p of ps){
      p.p+=.02;if(mode!=='stars'){p.y+=p.vy;p.x+=p.vx+Math.sin(p.p)*.25;if(p.y<-20)p.y=hh+10;if(p.y>hh+20)p.y=-10;if(p.x<-20)p.x=w+10;if(p.x>w+20)p.x=-10}
      const a=mode==='stars'?p.a*(.4+.6*Math.abs(Math.sin(p.p))):p.a;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);
      if(mode==='bubbles'){ctx.strokeStyle=`rgba(${cr},${cg},${cb},${a})`;ctx.lineWidth=1.2;ctx.stroke()}
      else{ctx.fillStyle=`rgba(${cr},${cg},${cb},${a})`;ctx.fill()}
    }
    raf=requestAnimationFrame(loop);
  };
  loop();
  stage._fx=()=>{on=false;cancelAnimationFrame(raf);if(ro)ro.disconnect()};
}

function preload(urls,tick){
  if(!urls.length)return Promise.resolve();
  let done=0;
  return Promise.all(urls.map(u=>new Promise(res=>{
    let f=0;const fin=()=>{if(f)return;f=1;done++;tick(done/urls.length);res()};
    if(isVideo(u))return fin();
    const i=new Image();i.onload=i.onerror=fin;i.src=u;setTimeout(fin,7000);
  })));
}

          const inner=h('div');f.f.forEach(sf=>inner.append(fieldEl(sf,it)));
          const mv=d=>{const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];draw();edTouch(true)};
          host.append(h('details',{class:'a-it'},h('summary',null,h('span',null,(i+1)+'. '+(f.title?f.title(it):'Item')),ib('↑',()=>mv(-1)),ib('↓',()=>mv(1)),ib('⧉',()=>{arr.splice(i+1,0,clone(it));draw();edTouch(true)}),ib('🗑',()=>{arr.splice(i,1);draw();edTouch(true)})),inner));
        });
        host.append(h('button',{class:'a-btn sm',type:'button',onclick:()=>{arr.push(clone(f.def||{}));draw();edTouch(true)}},'+ Tambah'));
      };
      draw();wrap.append(lab,host);break}
  }
  return wrap;
}

/* ---------- simpan ---------- */
async function doSave(){
  edCommit();
  const btn=$('[data-a=save]',A.box);if(btn){btn.disabled=true;btn.textContent='Menyimpan…'}
  try{
    const rec=Object.assign({},S.rec,{site:clone(E.site),meta:Object.assign({v:1,ns:NS_DEFAULT},S.rec.meta||{},{updated:new Date().toISOString()})});
    const r=await saveRec(rec);
    E.saved=JSON.stringify(E.site);E.dirty=false;S.site=clone(E.site);S.meta=rec.meta;A.changed=true;
    if(r.fail.length)toast(`Tersimpan di ${r.ok}/${r.total} bin. Gagal → ${r.fail.join(' • ')}`,true);
    else toast(`Tersimpan ✔ (${(r.n/1024).toFixed(1)} KB${r.total>1?', '+r.total+' bin':''}) — langsung live, tanpa deploy ulang`);
  }catch(e){toast(e.message,true)}
  if(btn){btn.disabled=false;btn.textContent='💾 Simpan'}edState();
}

    h('button',{class:'a-btn','data-a':'redo',type:'button',onclick:redo,title:'Ctrl+Y'},'↷ Redo'),
    h('span',{class:'sp1'}),h('span',{class:'ed-st'},''),

  ui.list=h('section',{class:'ed-l'});
  ui.props=h('section',{class:'ed-r'});

  const center=h('section',{class:'ed-c'},dev,phone);

/* pintasan keyboard di dashboard */
D.addEventListener('keydown',e=>{
  if(!S.authed||!A.el||A.el.hidden||A.tab!=='ed'||!E)return;
  const c=e.ctrlKey||e.metaKey,k=(e.key||'').toLowerCase(),typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName||'');
  if(c&&k==='s'){e.preventDefault();doSave()}
  else if(c&&!typing&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(c&&!typing&&k==='y'){e.preventDefault();redo()}
});

/* =====================================================================
   BOOT — loader → data JSONBin → render → fade-out → statistik
   ===================================================================== */
let LIVE=null;
function renderLive(){
  if(!LIVE||!S.site)return;
  loadFont(S.site.theme.font);
  renderSite(S.site,LIVE,{});startReveal(LIVE);
  if(S.site.theme.title)D.title=S.site.theme.title;
}
async function boot(){
  startGuard();
  const cache=LS.json('ig_cfg');
  const lcfg=(cache&&cache.rec&&cache.rec.site&&cache.rec.site.loader)||DEF.loader;
  const ld=buildLoader(lcfg);D.body.append(ld);
  const fill=$('.ld-bar i',ld),minMs=clamp(lcfg.minMs||1500,500,6000);
  let target=4,shown=0,done=false;const t0=performance.now();
  const bump=v=>{target=Math.max(target,Math.min(100,v))};
  const finished=new Promise(res=>{
    const frame=()=>{
      const cap=Math.min(100,((performance.now()-t0)/minMs)*100);
      const goal=Math.min(target,cap);
      shown+=Math.max((goal-shown)*.1,goal>shown?.12:0);if(shown>goal)shown=goal;
      fill.style.width=shown.toFixed(2)+'%';
      if(shown>=99.9&&target>=100){fill.style.width='100%';res();return}
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });

  let rec=null;
  try{rec=await loadRec(false)}catch(e){}
  bump(35);
  S.rec=rec;S.meta=(rec&&rec.meta)||{};
  S.site=normalize(rec);
  let site=S.site;
  await loadFont(site.theme.font);bump(50);
  await preload(collectAssets(site),f=>bump(50+f*48));
  const stage=h('div',{class:'stage'});LIVE=stage;
  try{renderSite(site,stage,{})}catch(e){S.site=normalize(null);renderSite(S.site,stage,{})}
  D.body.insertBefore(stage,ld);
  if(site.theme.title)D.title=site.theme.title;
  bump(100);
  await finished;
  await sleep(180);
  ld.classList.add('hide');
  startReveal(stage);
  D.body.style.overflow='hidden';
  setTimeout(()=>{ld.remove()},1100);
  countVisit();
}
if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',boot);else boot();
})();
